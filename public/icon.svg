<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7800ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020108" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#020108"/>
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)"/>

  <!-- Orbital Rings -->
  <ellipse cx="256" cy="256" rx="170" ry="85" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.8" transform="rotate(-25 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="150" ry="75" fill="none" stroke="#00f2fe" stroke-width="4" opacity="0.6" transform="rotate(35 256 256)"/>

  <!-- Sphere Dots Ring -->
  <circle cx="256" cy="180" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="330" cy="220" r="8" fill="#4facfe"/>
  <circle cx="350" cy="290" r="9" fill="#00f2fe"/>
  <circle cx="310" cy="350" r="7" fill="#a855f7"/>
  <circle cx="240" cy="360" r="8" fill="#00f2fe"/>
  <circle cx="170" cy="330" r="9" fill="#4facfe"/>
  <circle cx="150" cy="250" r="8" fill="#a855f7"/>
  <circle cx="190" cy="190" r="7" fill="#00f2fe"/>

  <!-- Glowing Core -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="48" fill="#ffffff"/>

  <!-- Stylized "F" inside core -->
  <path d="M242 232 H274 V242 H254 V252 H270 V262 H254 V280 H242 Z" fill="#020108"/>
</svg>
